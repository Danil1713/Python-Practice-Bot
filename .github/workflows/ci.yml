name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: python_practice
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready -U python_practice -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd
          "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://python_practice:ci_password@localhost:5432/python_practice_test
      DATABASE_URL: postgresql+asyncpg://python_practice:ci_password@localhost:5432/python_practice_test
      REDIS_URL: redis://localhost:6379/0

      BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi

      OPENAI_API_KEY: test-openai-api-key
      AI_MODEL: gpt-5.6-terra
      AI_REASONING_EFFORT: low
      AI_MAX_OUTPUT_TOKENS: "3000"
      AI_TIMEOUT_SECONDS: "45"
      AI_MAX_ATTEMPTS: "3"
      AI_RETRY_BASE_DELAY_SECONDS: "1"
      AI_MAX_CONCURRENCY: "2"

      ADMIN_TELEGRAM_IDS: "123456789"
      ADMIN_USERNAME: test_admin
      APP_TIMEZONE: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Check linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check Alembic heads
        run: python -m alembic heads

      - name: Run tests
        run: pytest -q